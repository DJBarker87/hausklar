name: CI
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python -m pip install --require-hashes -r server/requirements.lock
      - run: python -m pip install ruff pip-audit pytest pytest-asyncio
      - run: cd server && ruff check app tests && pytest
      - run: pip-audit -r server/requirements.lock --require-hashes
  pwa:
    runs-on: ubuntu-latest
    defaults: {run: {working-directory: server/web}}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: 22, cache: npm, cache-dependency-path: server/web/package-lock.json}
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high
  public-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: gitleaks/gitleaks-action@v2
      - run: ./scripts/public-release-audit.sh
  ios:
    # HausKlar requires Xcode 26+. Pin the known-good 26.2 toolchain because
    # runner defaults can change independently of the source tree.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
      - run: cd ios/HausKlar && xcodegen
      - run: xcodebuild -version
      - run: cd ios/HausKlar && xcodebuild -project HausKlar.xcodeproj -scheme HausKlar -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build
