[project]
name = "hausklar"
version = "1.0.0"
description = "HausKlar — Know what's happening today"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.139.0",
    "starlette>=1.3.1",
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "PyJWT>=2.10.1",
    "pwdlib[argon2,bcrypt]>=0.3.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.14.2",
    "python-multipart>=0.0.31",
    "cryptography>=50.0.0",
    "aiohttp>=3.14.3",
    "httpx>=0.28.0",
    "h2>=4.2.0",
    "apscheduler>=3.10.0",
    "python-dateutil>=2.9.0",
    "icalendar>=7.0.0",
    "pywebpush>=2.0.3",
    "resend>=2.32.2",
    "pypdf>=6.15.0",
    "pillow>=11.3.0",
    "pillow-heif>=1.1.0",
    "idna>=3.15",
    "requests>=2.33.0",
    "urllib3>=2.7.0",
    "python-dotenv>=1.2.2",
    "fitdecode>=0.11.0",
    "pyarrow>=19.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.24.0",
    "pip-audit>=2.10.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E501"]

[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.build_meta"
